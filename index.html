<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stickman Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font:16px system-ui;padding:16px}main{max-width:900px;margin:auto}canvas{width:100%;background:#192638;border-radius:12px;display:block}nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}button{background:#334155;color:white;border:1px solid #64748b;border-radius:12px;padding:18px;touch-action:none;user-select:none;font-size:16px}button:active{background:#0d9488}small{color:#94a3b8}html,body,main,canvas,button,nav,button *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}button,canvas{touch-action:none}nav{margin-top:8px}nav button{flex:1;min-height:54px;padding:10px;font-weight:700}nav div{display:flex;gap:6px;flex:1}nav:first-of-type button{min-width:0}button[data-k]{box-shadow:0 3px 0 #0b1220;background:#26384e}button[data-k].active{background:#0f766e;transform:translateY(2px);box-shadow:none}button[data-k="punch"],button[data-k="kick"]{background:#713b45}button[data-k="punch"].active,button[data-k="kick"].active{background:#be5262}</style><main><h2>STICKMAN LAB <small>v0.5.0</small></h2><canvas width="720" height="400"></canvas><nav><div><button data-k="left">◀</button> <button data-k="right">▶</button></div><div><button data-k="run">ダッシュ</button> <button data-k="jump">ジャンプ</button></div></nav><nav><button data-k="duck">しゃがむ</button><button data-k="dodge">回避</button></nav><nav><button data-k="punch">パンチ</button><button data-k="kick">キック</button></nav><nav><button id="equip">装備：素手</button><button data-k="weapon">武器攻撃</button></nav><p id="status"></p><button id="reset">リセット</button><p><small>方向キー / A・D：移動　Space：ジャンプ　Shift：ダッシュ　↓ / S：しゃがむ　Q：回避　J：パンチ　K：キック　L：武器攻撃</small></p></main><script>
let equipment=0;const gear=['素手','木刀','長杖'];document.querySelector('#equip').onclick=()=>{equipment=(equipment+1)%gear.length;document.querySelector('#equip').textContent='装備：'+gear[equipment]};const c=document.querySelector('canvas'),g=c.getContext('2d'),keys={},map={ArrowLeft:'left',ArrowRight:'right',a:'left',d:'right',Shift:'run',' ':'jump',ArrowUp:'jump',w:'jump',ArrowDown:'duck',s:'duck',Control:'dodge',q:'dodge',j:'punch',k:'kick',l:'weapon'};let x=120,y=330,vx=0,vy=0,face=1,phase=0,ground=true,held=false,last=0,jumps=0,dodge=0,cool=0,dheld=false,attack=0,kind='',ah=false,hp=100,hit=false,flash=0,tx=550,tv=0,land=0;

document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());document.querySelectorAll('button').forEach(b=>b.addEventListener('touchstart',e=>{if(window.getSelection)window.getSelection().removeAllRanges()},{passive:true}));function line(a,b,c,d){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function frame(t){let dt=last?Math.min((t-last)/16.667,2):1;last=t;let dir=Number(!!keys.right)-Number(!!keys.left);vx+=(dir*(keys.run?7:3.2)-vx)*Math.min(1,(ground?(dir?.16:.25):.08)*dt);if(dir)face=dir;let duck=keys.duck&&ground;cool=Math.max(0,cool-dt);dodge=Math.max(0,dodge-dt);if(keys.dodge&&!dheld&&cool===0){dodge=12;cool=40}dheld=!!keys.dodge;if(duck)vx*=.55;if(dodge>0)vx=face*12;if(keys.jump&&!held&&jumps<2&&!duck){vy=jumps===0?-12.5:-10.5;ground=false;jumps++}held=!!keys.jump;vy+=.55*dt;y+=vy*dt;x=Math.max(28,Math.min(692,x+vx*dt));land=Math.max(0,land-dt);if(y>=330){if(!ground)land=9;y=330;vy=0;ground=true;jumps=0}attack=Math.max(0,attack-dt);flash=Math.max(0,flash-dt);let pressed=keys.punch||keys.kick||keys.weapon;if(pressed&&!ah&&attack===0){kind=keys.weapon&&equipment?'weapon':keys.kick?'kick':'punch';attack=kind==='kick'?24:16;hit=false}ah=!!pressed;if(attack>0&&attack<(kind==='kick'?17:11)&&attack>(kind==='kick'?7:5)&&!hit&&hp>0&&Math.abs(tx-x)<(kind==='weapon'?(equipment===2?125:100):kind==='kick'?85:65)&&(tx-x)*face>0&&330-y<45){hp=Math.max(0,hp-(kind==='weapon'?(equipment===2?15:25):kind==='kick'?20:10));hit=true;flash=12;tv=face*(kind==='kick'?8:4)}tx=Math.max(35,Math.min(685,tx+tv*dt));tv*=Math.pow(.87,dt);phase+=Math.abs(vx)*.085*dt;g.fillStyle='#172233';g.fillRect(0,0,720,400);g.strokeStyle='#26364b';g.lineWidth=1;for(let i=0;i<720;i+=40)line(i,0,i,400);for(let i=10;i<400;i+=40)line(0,i,720,i);g.fillStyle='#27374a';g.fillRect(0,330,720,70);g.strokeStyle='#5eead4';line(0,330,720,330);if(hp>0){g.save();g.translate(tx,330);g.strokeStyle=flash?'#fff':'#f87171';g.lineWidth=4;g.lineCap='round';g.beginPath();g.arc(0,-83,12,0,Math.PI*2);g.stroke();line(0,-71,0,-34);line(0,-34,-15,0);line(0,-34,15,0);line(0,-62,-20,-40);line(0,-62,20,-40);g.restore()}g.fillStyle='#475569';g.fillRect(tx-40,218,80,6);g.fillStyle='#ef4444';g.fillRect(tx-40,218,.8*hp,6);g.fillStyle='#fff';g.font='12px sans-serif';g.fillText('TARGET '+hp,tx-40,210);
g.save();g.translate(x,y);g.scale(face,1);
let move=Math.min(1,Math.abs(vx)/3),run=Math.min(1,Math.abs(vx)/7),s=Math.sin(phase),bob=ground?Math.abs(s)*move*3:0;
let crouch=duck?19:land/9*9,hip=[0,-36+crouch+bob],shoulder=[run*10+(dodge>0?14:0),-64+crouch+bob],head=[shoulder[0]+2,shoulder[1]-20];

function limb(a,b,c,color){g.strokeStyle=color;line(...a,...b);line(...b,...c)}
function pose(side){let a=s*side*move,foot=[side*8+a*(15+run*12),-Math.max(0,Math.cos(phase)*side)*move*12],knee=[foot[0]*.5+5,-17+crouch*.35];let elbow=[shoulder[0]-a*18+side*5,shoulder[1]+15],hand=[elbow[0]+7,elbow[1]+12];if(!ground){foot=[side*13+(vy<0?8:-5),-10-(side===1?12:0)];knee=[side*9+12,-24];elbow=[shoulder[0]+side*16,shoulder[1]+8];hand=[elbow[0]+10,elbow[1]-8]}if(duck){foot=[side*15,0];knee=[side*9+10,-12]}if(attack>0&&side===1){if(kind==='kick'){knee=[12+20*ext,hip[1]-8*ext];foot=[18+47*ext,hip[1]-13*ext+20*(1-ext)]}else{elbow=[shoulder[0]+5+22*ext,shoulder[1]+12*(1-ext)];hand=[shoulder[0]+10+43*ext,shoulder[1]+18*(1-ext)]}}return {foot,knee,elbow,hand}}
g.lineWidth=4.5;g.lineCap='round';g.lineJoin='round';let back=pose(-1),front=pose(1);limb(hip,back.knee,back.foot,'#9aa9bd');limb(shoulder,back.elbow,back.hand,'#9aa9bd');g.strokeStyle='#fff';line(...hip,...shoulder);line(...shoulder,head[0],head[1]+12);g.beginPath();g.arc(...head,12,0,Math.PI*2);g.stroke();limb(hip,front.knee,front.foot,'#fff');limb(shoulder,front.elbow,front.hand,'#fff');if(equipment){let h=front.hand,active=attack>0&&kind==='weapon',angle=active?-.9+2.4*p:-1.2,len=equipment===2?78:53;g.strokeStyle=equipment===2?'#d4b78c':'#b98b62';g.lineWidth=equipment===2?5:7;line(h[0]-Math.cos(angle)*8,h[1]-Math.sin(angle)*8,h[0]+Math.cos(angle)*len,h[1]+Math.sin(angle)*len)}g.restore();document.querySelector('#status').textContent=(dodge>0?'回避中':duck?'しゃがみ中':!ground?(jumps===2?'二段ジャンプ中':'ジャンプ中'):Math.abs(vx)<.2?'待機中':keys.run?'ダッシュ中':'歩行中')+' ｜ X: '+Math.round(x)+' Y: '+Math.round(330-y);requestAnimationFrame(frame)}requestAnimationFrame(frame);
