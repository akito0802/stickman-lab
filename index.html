<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stickman Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font:16px system-ui;padding:16px}main{max-width:900px;margin:auto}canvas{width:100%;background:#192638;border-radius:12px;display:block}nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}button{background:#334155;color:white;border:1px solid #64748b;border-radius:12px;padding:18px;touch-action:none;user-select:none;font-size:16px}button:active{background:#0d9488}small{color:#94a3b8}html,body,main,canvas,button,nav,button *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}button,canvas{touch-action:none}</style><main><h2>STICKMAN LAB <small>v0.3.0</small></h2><canvas width="720" height="400"></canvas><nav><div><button data-k="left">◀</button> <button data-k="right">▶</button></div><div><button data-k="run">ダッシュ</button> <button data-k="jump">ジャンプ</button></div></nav><nav><button data-k="duck">しゃがむ</button><button data-k="dodge">回避</button></nav><nav><button data-k="punch">パンチ</button><button data-k="kick">キック</button></nav><p id="status"></p><button id="reset">リセット</button><p><small>方向キー / A・D：移動　Space：ジャンプ　Shift：ダッシュ　↓ / S：しゃがむ　Q：回避　J：パンチ　K：キック</small></p></main><script>
